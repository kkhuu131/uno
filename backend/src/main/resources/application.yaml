spring:
  application:
    name: backend

# Browser frontends on another origin (e.g. Vite) need CORS. Override or extend this list as needed.
app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:5174"
      - "http://127.0.0.1:5174"
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
